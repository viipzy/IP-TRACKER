<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     
  <link rel="stylesheet" href="styles.css">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/icon-location.svg">
  
  <title>IP Address Tracker</title>
 
  
</head>
<body>
<main class="header">
<h1>
  IP Address Tracker
</h1>
<form class="first" id="searchField">
  <label for="searchField">
<input type="text" placeholder="Search for any IP or domain" id="search" name="number">
</label>
    <button>
      <img src="./images/icon-arrow.svg" alt="arrow indicating go">
    </button>  
 
</main>

<div class="pop-up">


    <h2>IP Address 
    <p id="ip">__ </p>
    </h2>



  <h2>Location
  <p id="location">__</p>
</h2>



  <h2>Timezone
    <p id="timezone">__</p>
  </h2>

  <h2>ISP
    <p id="isp">__</p>
  </h2>

</div>


<div id="map">

</div>    

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
